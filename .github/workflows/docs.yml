name: Docs

# Builds the documentation site on every change to the docs or the API, and
# publishes it to GitHub Pages from `main`. Pull requests only build it, so a
# broken link fails the check instead of reaching the site.
on:
  push:
    branches: [main]
    paths:
      - 'doc/**'
      - 'tool/build_llms.dart'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'doc/**'
      - 'tool/build_llms.dart'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs
        run: pip install -r requirements-docs.txt

      - name: Build the guides
        run: mkdocs build --strict --site-dir site

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build the API reference
        run: dart doc --output site/api

      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
