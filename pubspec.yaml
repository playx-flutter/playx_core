name: playx_core
description: Core package for playx eco system contains shared classes and utilities.
version: 2.0.0
homepage: https://sourcya.io/
repository: https://github.com/playx-flutter/playx_core
issue_tracker: https://github.com/playx-flutter/playx_core/issues
topics:
  - playx
  - ecosystem
  - core
  - prefs
  - env

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ">=2.3.0 <3.0.0"
  equatable: ">=2.0.7 <4.0.0"
  sprintf: ^7.0.0
  flutter_secure_storage: ^11.2.0
  simple_secure_storage: ^0.4.3
  pointycastle: ">=3.9.1 <5.0.0"
  flutter_dotenv: ^6.0.1
  get_it: ">=8.0.0 <10.0.0"
  worker_manager: ">=7.2.7 <8.0.0"
  talker_logger: ">=5.1.0 <6.0.0"
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.0
  simple_secure_storage_platform_interface: ^0.2.4
  flutter_secure_storage_platform_interface: ^2.1.1
